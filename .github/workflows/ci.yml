name: Cooling Alpha Public Truth Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile bounded core
        run: python -m py_compile src/thermal_spec.py tests/test_thermal_spec.py scripts/verify_public_core.py
      - name: Verify bounded public core
        run: python scripts/verify_public_core.py
      - name: Verify public truth boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('README.md').read_text(encoding='utf-8')
          required = [
              'Independent portfolio project',
              'thermal_envelope_evaluator',
              'hardware_actuation: false',
              'runtime_pairing_with_omega: false',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'README truth boundary missing: {missing}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cooling-alpha-proof-py${{ matrix.python-version }}
          path: artifacts/public-core/verification.json
          if-no-files-found: error
